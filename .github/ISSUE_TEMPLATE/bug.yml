name: Bug report
description: Something in Tents doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 (build number)
    validations:
      required: true
  - type: input
    id: tents-version
    attributes:
      label: Tents version or commit
  - type: textarea
    id: setup
    attributes:
      label: Display setup
      description: Number of monitors, resolutions and DPI scaling, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
