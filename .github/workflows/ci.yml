name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the SDK version/rollForward policy from global.json.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Tents.sln

      # Warnings are errors (Directory.Build.props), so this step is also the build-warnings gate.
      - name: Build (Release)
        run: dotnet build Tents.sln -c Release --no-restore

      # Tests that need a signed-in desktop with Explorer are marked Category=Desktop and run by hand
      # (CONTRIBUTING.md, "Tests that need a desktop").
      - name: Test
        run: >
          dotnet test Tents.sln -c Release --no-build
          --filter "Category!=Desktop"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Check formatting
        run: dotnet format Tents.sln --verify-no-changes --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
